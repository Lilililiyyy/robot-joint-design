<text x="620" y="145" font-size="20">参数与图义</text>
<text x="620" y="182">齿数 zs / zp / zr：20 / 40 / 100</text>
<text x="620" y="213">行星数量：3；速比：6</text>
<text x="620" y="244">模数：0.5 mm</text>
<text x="620" y="275">齿宽：5 mm</text>
<text x="620" y="306">销中心圆半径：15 mm</text>
<text x="620" y="337">双支承间距：24 mm</text>
<text x="620" y="368">虚线：齿轮参考圆；绿色点划圆：销中心圆</text>
<text x="620" y="399">细实线：默认齿顶圆与齿根圆</text>
<text x="620" y="430">十字：销中心；辐射线仅辅助表示方位</text>
<text x="620" y="461">参数文件统一采用 m / rad 等SI单位</text>
