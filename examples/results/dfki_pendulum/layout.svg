<text x="36" y="605" font-size="15">参数布局；圆线不代表真实制造齿廓，未构造三维实体。</text>
<text x="36" y="629" font-size="13">未提供电机、轴承和制动器包络，图中不绘制其外形；孔位公差、配合与工艺需另行设计。</text>
